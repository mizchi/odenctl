[workspace]
members = ["crates/runtime-core", "crates/oden"]
exclude = [
  "infra/aws-image/service",
  "sdk/rust",
  "examples/service-rust",
  "examples/telemetry-composition/provider",
  "examples/telemetry-composition/app",
  "examples/standard-http",
  "examples/standard-http-p3",
  "examples/durable-counter",
  "examples/hello-worker",
  "examples/rust-interop",
  "examples/rust-moonbit-release/rust-worker",
  "examples/rust-moonbit-release/rust-wac-caller",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
