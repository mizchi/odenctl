[package]
name = "oden-service-sdk"
version = "0.1.0"
edition = "2024"
description = "WASI service lifecycle and I/O SDK for oden"
license = "MIT"
repository = "https://github.com/mizchi/odenctl"
readme = "README.md"
include = ["src/**", "wit/**", "README.md", "Cargo.toml"]

[dependencies]
wasip3 = { version = "=0.9.0", features = ["async-spawn"] }
wit-bindgen = { version = "=0.62.0", features = ["async"] }
