app = "wasmplane-runtime"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node --experimental-strip-types src/runtime/main.ts"

[env]
  RUNTIME_HOST = "0.0.0.0"
  RUNTIME_PORT = "8080"
  RUNTIME_CONCURRENCY = "128"
  RUNTIME_MEMORY_MB = "2048"
  RUNTIME_PUBLIC_URL = "https://wasmplane-runtime.fly.dev"
  WASMPLANE_CACHE_DIR = "/data/cache"
  WASMPLANE_ARTIFACT_CACHE_DIR = "/data/artifacts"
  WASMPLANE_KV_STORE_DIR = "/data/kv"
  WASMPLANE_WASIP3_HOST_BIN = "/usr/local/bin/wasmplane-wasip3-host"

[mounts]
  source = "wasmplane_runtime_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/__runtime/healthz"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
