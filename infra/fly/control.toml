app = "mz-wasmplane-control"
primary_region = "nrt"

[build]
  dockerfile = "infra/docker/odenctl.Dockerfile"

[processes]
  app = "node --experimental-strip-types src/main.ts"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  ODENCTL_DB = "/data/wasmplane.sqlite"
  ODENCTL_AUDIT_LOG = "/data/audit.jsonl"
  ODENCTL_ARTIFACT_DIR = "/data/artifacts"
  ODENCTL_ARTIFACT_PUBLIC_BASE_URL = "auto"
  ODENCTL_VOLUME_SQLITE_ROOT = "/data/sqlite"
  ODENCTL_VOLUME_SQLITE_MAX_OPEN = "64"
  ODENCTL_VOLUME_SQLITE_MAX_PENDING_WRITES = "64"
  ODENCTL_VOLUME_SQLITE_MAX_BACKUPS_PER_DATABASE = "24"
  ODENCTL_VOLUME_SQLITE_BACKUP_RETENTION_MS = "604800000"
  ODEN_WASIP3_HOST_BIN = "/usr/local/bin/oden-host"
  ODENCTL_SNAPSHOT_PUBLISH_INTERVAL_MS = "5000"
  ODENCTL_DURABLE_OBJECT_ALARM_INTERVAL_MS = "1000"
  ODENCTL_DURABLE_OBJECT_ALARM_NAMESPACES = "alarm-demo"
  ODENCTL_DURABLE_OBJECT_ALARM_WEBHOOK_URL = "https://mz-wasmplane-control.fly.dev/alarm-demo/webhook"

[mounts]
  source = "wasmplane_control_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
