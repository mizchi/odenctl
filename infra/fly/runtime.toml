app = "mz-wasmplane-runtime"
primary_region = "nrt"

[build]
  dockerfile = "infra/docker/odenctl.Dockerfile"

[processes]
  app = "node --experimental-strip-types src/runtime/main.ts"

[env]
  RUNTIME_HOST = "::"
  RUNTIME_PORT = "8080"
  RUNTIME_CONCURRENCY = "64"
  RUNTIME_MEMORY_MB = "2048"
  RUNTIME_PUBLIC_URL = "auto"
  RUNTIME_SNAPSHOT_WARMUP = "1"
  RUNTIME_ROUTE_SNAPSHOT_FILE = "/data/route-snapshot.json"
  ODEN_CACHE_DIR = "/data/cache"
  ODEN_ARTIFACT_CACHE_DIR = "/data/artifacts"
  ODEN_WASIP3_HOST_BIN = "/usr/local/bin/oden-host"
  ODEN_WASIP3_HOST_DAEMON = "1"
  ODEN_WASIP3_HOST_DAEMON_ROUTES = "1"
  ODEN_WASIP3_HOST_DAEMON_WORKER_PROXY = "1"
  ODEN_WASIP3_HOST_DAEMON_PORT = "8790"
  ODEN_WASIP3_HOST_MAX_PREPARED_COMPONENTS = "512"
  ODEN_WASIP3_HOST_MAX_CONCURRENT_INVOCATIONS = "64"
  ODEN_WASIP3_POOLING_TOTAL_COMPONENT_INSTANCES = "64"
  ODEN_WASIP3_POOLING_TOTAL_CORE_INSTANCES = "256"
  ODEN_WASIP3_POOLING_TOTAL_MEMORIES = "64"
  ODEN_WASIP3_POOLING_TOTAL_TABLES = "128"
  ODEN_WASIP3_POOLING_MEMORY_MB = "64"

[mounts]
  source = "wasmplane_runtime_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/__runtime/healthz"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
