app = "mz-wasmplane-otel-collector"
primary_region = "nrt"

[build]
  dockerfile = "infra/docker/otelcol.Dockerfile"

[http_service]
  internal_port = 13133
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[metrics]
  port = 9464
  path = "/metrics"
