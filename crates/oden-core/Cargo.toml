[package]
name = "oden-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
getrandom = "0.3"
http-body-util = "0.1"
http-body = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasmtime = { version = "=48.0.2", features = ["component-model", "component-model-async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "=48.0.2", features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "=48.0.2", features = ["p2", "p3", "component-model-async"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
