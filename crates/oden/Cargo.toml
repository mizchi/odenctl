[package]
name = "oden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
default-run = "oden"

[dependencies]
oden-runtime-core = { path = "../runtime-core" }
anyhow = "1.0.100"
serde_json = "1.0.145"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "oden"
path = "src/standalone.rs"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
