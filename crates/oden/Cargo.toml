[package]
name = "oden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
default-run = "oden"

[dependencies]
oden-runtime-core = { path = "../runtime-core" }
anyhow = "1.0.100"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
serde_json = "1.0.145"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "oden"
path = "src/standalone.rs"

[[bin]]
name = "oden-host"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
