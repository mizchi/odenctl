groups:
  - name: wasmplane-runtime
    rules:
      - alert: WasmplaneRuntimeHighErrorRate
        expr: |
          sum(rate(wasmplane_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
          /
          clamp_min(sum(rate(wasmplane_calls_total[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Wasmplane runtime span error rate is above 5%
      - alert: WasmplaneRuntimeHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(wasmplane_duration_milliseconds_bucket[5m])) by (le)
          ) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Wasmplane runtime p95 span latency is above 1s
