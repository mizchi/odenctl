name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - uses: extractions/setup-just@v3

      - uses: opentofu/setup-opentofu@v1

      - name: Validate OpenTofu infrastructure
        run: |
          just tofu-fmt-check
          just tofu-validate

      - name: Install Wasm tooling
        run: |
          cargo install wasm-tools --version 1.245.1 --locked
          cargo install wit-bindgen-cli --version 0.51.0 --locked

      - name: Run unit and integration tests
        run: just test

      - name: Run real Wasm E2E
        run: just e2e
