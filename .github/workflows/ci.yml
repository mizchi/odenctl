name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wasmplane-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wasmplane-${{ github.job }}-
            ${{ runner.os }}-rust-wasmplane-

      - uses: extractions/setup-just@v3

      - uses: opentofu/setup-opentofu@v1

      - name: Validate OpenTofu infrastructure
        run: |
          just tofu-fmt-check
          just tofu-validate

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "42.0.1"

      - name: Setup wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.245.1"

      - name: Setup wit-bindgen
        uses: bytecodealliance/actions/wit-bindgen/setup@v1
        with:
          version: "0.51.0"

      - name: Run unit and integration tests
        run: just test

      - name: Run real Wasm E2E
        run: just e2e

  wac-migration-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wac
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wac-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wac-

      - uses: extractions/setup-just@v3

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "42.0.1"

      - name: Setup wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.245.1"

      - name: Setup wit-bindgen
        uses: bytecodealliance/actions/wit-bindgen/setup@v1
        with:
          version: "0.51.0"

      - name: Install WAC
        run: just wac-install

      - name: Generate WAC migration report
        run: just sample-rust-moonbit-wac-status

      - name: Append WAC migration summary
        if: ${{ always() }}
        run: |
          if [ -f reports/wac-migration.md ]; then
            cat reports/wac-migration.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wasmplane-wac-migration
          path: reports/wac-migration.md
          retention-days: 30
