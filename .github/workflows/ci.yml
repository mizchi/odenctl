name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  deployment-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build the deployment image on Linux
        run: just aws-image-build oden-service:ci linux/amd64
      - name: Verify HTTP and graceful restarts in the restricted container
        run: just aws-container-test oden-service:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-odenctl-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-odenctl-${{ github.job }}-
            ${{ runner.os }}-rust-odenctl-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2

      - name: Validate OpenTofu infrastructure
        run: |
          just tofu-fmt-check
          just tofu-validate

      - name: Install Wasm CI tools
        run: bash tools/scripts/install-wasm-ci-tools.sh

      - name: Run unit and integration tests
        run: just test

      - name: Run real Wasm E2E
        run: just e2e

      - name: Run standalone WASI HTTP integration
        run: just standalone-test

      - name: Verify binary bodies through deployment adapters
        run: just binary-http-test

      - name: Verify response caching with a real WASI P3 guest
        run: just response-cache-test

      - name: Install Chromium for static site release tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify static site release and rollback in Chromium
        run: just static-site-test

      - name: Save static site browser reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: odenctl-static-site-browser
          path: |
            target/playwright-report
            target/playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Run async worker and daemon integration
        run: just worker-async-test

  wac-migration-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wac
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wac-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wac-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1

      - name: Install Wasm CI tools
        run: bash tools/scripts/install-wasm-ci-tools.sh

      - name: Install WAC
        run: just wac-install

      - name: Run minimal WAT and MoonBit commands
        run: just minimal-smoke

      - name: Run resident service SDK conformance and application dev tests
        run: just service-test

      - name: Verify standalone SDK packages and I/O
        run: just sdk-test

      - name: Verify exported tests with WAT, Rust and MoonBit
        run: just test-runner-test

      - name: Verify host telemetry, SDK context propagation and WAC wrappers
        run: just telemetry-test

      - name: Verify resident benchmark and process cleanup
        run: just service-bench-test

      - name: Generate WAC migration report
        run: just sample-rust-moonbit-wac-status

      - name: Append WAC migration summary
        if: ${{ always() }}
        run: |
          if [ -f reports/wac-migration.md ]; then
            cat reports/wac-migration.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: odenctl-wac-migration
          path: reports/wac-migration.md
          retention-days: 30
