name: Rust MoonBit Release

on:
  workflow_dispatch:
    inputs:
      control_plane_url:
        description: Control plane base URL
        required: true
        default: https://mz-wasmplane-control.fly.dev
        type: string
      runtime_url:
        description: Runtime base URL
        required: true
        default: https://mz-wasmplane-runtime.fly.dev
        type: string
      sample_host:
        description: Host header routed to the Rust + MoonBit sample
        required: true
        default: rust-moonbit.sample.oden.local
        type: string
      project_id:
        description: Project id used by the release smoke
        required: true
        default: prj_rust_moonbit_release
        type: string

permissions:
  contents: read

concurrency:
  group: rust-moonbit-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  rust-moonbit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      ODENCTL_CONTROL_PLANE_URL: ${{ inputs.control_plane_url }}
      ODEN_RUNTIME_URL: ${{ inputs.runtime_url }}
      ODENCTL_SAMPLE_HOST: ${{ inputs.sample_host }}
      ODENCTL_SAMPLE_PROJECT_ID: ${{ inputs.project_id }}
      ODENCTL_CONTROL_PLANE_TOKEN: ${{ secrets.ODENCTL_CONTROL_PLANE_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wac
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wac-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wac-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1

      - name: Install Wasm CI tools
        run: bash scripts/install-wasm-ci-tools.sh

      - name: Install WAC
        run: just wac-install

      - name: Check release preflight
        run: just sample-rust-moonbit-release-preflight

      - name: Run live Rust + MoonBit release smoke
        run: just sample-rust-moonbit-release

      - name: Generate WAC migration report
        if: ${{ always() }}
        run: just sample-rust-moonbit-wac-status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: odenctl-rust-moonbit-release
          path: |
            reports/wac-migration.md
            examples/rust-moonbit-release/target/rust-moonbit-release.component.wasm
          retention-days: 30
