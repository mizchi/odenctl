name: Weekly Performance

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wasmplane-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wasmplane-${{ github.job }}-
            ${{ runner.os }}-rust-wasmplane-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Wasm CI tools
        run: bash scripts/install-wasm-ci-tools.sh

      - name: Run weekly perf regression
        run: just perf-regression
        env:
          WASMPLANE_PERF_ITERATIONS: "20"
          WASMPLANE_PERF_WARMUP: "2"
          WASMPLANE_PERF_CONCURRENCY: "1,4"
          WASMPLANE_PERF_NODES: "1,2"

      - name: Append perf summary
        if: ${{ always() }}
        run: |
          if [ -f perf-results/perf-regression.md ]; then
            cat perf-results/perf-regression.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: wasmplane-perf-results
          path: perf-results/
          retention-days: 30
