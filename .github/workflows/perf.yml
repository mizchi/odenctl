name: Weekly Performance

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wasmplane-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wasmplane-${{ github.job }}-
            ${{ runner.os }}-rust-wasmplane-

      - uses: extractions/setup-just@v3

      - name: Setup wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.245.1"

      - name: Setup wit-bindgen
        uses: bytecodealliance/actions/wit-bindgen/setup@v1
        with:
          version: "0.51.0"

      - name: Run weekly perf regression
        run: just perf-regression
        env:
          WASMPLANE_PERF_ITERATIONS: "20"
          WASMPLANE_PERF_WARMUP: "2"
          WASMPLANE_PERF_CONCURRENCY: "1,4"
          WASMPLANE_PERF_NODES: "1,2"

      - name: Append perf summary
        if: ${{ always() }}
        run: |
          if [ -f perf-results/perf-regression.md ]; then
            cat perf-results/perf-regression.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wasmplane-perf-results
          path: perf-results/
          retention-days: 30
