name: Rust MoonBit Smoke

on:
  workflow_dispatch:

concurrency:
  group: rust-moonbit-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  rust-moonbit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wac
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wasmplane-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wasmplane-

      - uses: extractions/setup-just@v3

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "42.0.1"

      - name: Setup wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.245.1"

      - name: Setup wit-bindgen
        uses: bytecodealliance/actions/wit-bindgen/setup@v1
        with:
          version: "0.51.0"

      - name: Install WAC
        run: just wac-install

      - name: Run Rust + MoonBit smoke
        run: just sample-rust-moonbit-smoke

      - name: Generate WAC migration report
        if: ${{ always() }}
        run: just sample-rust-moonbit-wac-status

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wasmplane-rust-moonbit-smoke
          path: |
            reports/wac-migration.md
            examples/rust-moonbit-release/target/rust-moonbit-release.component.wasm
          retention-days: 30
