name: Rust MoonBit Smoke

on:
  workflow_dispatch:

concurrency:
  group: rust-moonbit-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  rust-moonbit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1 --toolchain stable

      - name: Cache Rust build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/wac
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/**/target
          key: ${{ runner.os }}-rust-wac-${{ hashFiles('Cargo.lock', '**/Cargo.lock', '**/Cargo.toml', 'justfile') }}
          restore-keys: |
            ${{ runner.os }}-rust-wac-

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1

      - name: Install Wasm CI tools
        run: bash scripts/install-wasm-ci-tools.sh

      - name: Install WAC
        run: just wac-install

      - name: Run Rust + MoonBit smoke
        run: just sample-rust-moonbit-smoke

      - name: Generate WAC migration report
        if: ${{ always() }}
        run: just sample-rust-moonbit-wac-status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: wasmplane-rust-moonbit-smoke
          path: |
            reports/wac-migration.md
            examples/rust-moonbit-release/target/rust-moonbit-release.component.wasm
          retention-days: 30
